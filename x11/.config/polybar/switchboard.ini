; Standalone i3/Polybar bottom bar for Switchboard.
; Installed at ~/.config/polybar/switchboard.ini; launch with:
;   polybar -c ~/.config/polybar/switchboard.ini switchboard

[colors]
background = #99282A2E
foreground = #C5C8C6
working = #8ABEB7
idle = #F0C674
permission = #A54242
disabled = #707880

[bar/switchboard]
bottom = true
width = 100%
height = 44pt
radius = 4
dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
border-size = 4pt
border-color = #00000000

padding-top = 5
padding-left = 1.5
padding-right = 1.5
module-margin = 1

font-0 = ${env:POLYBAR_FONT:monospace:size=18;0}
modules-center = switchboard

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3

[module/switchboard]
type = custom/script
; Polybar references only resolve when they occupy the whole value. Export the
; palette to the child and let the shell expand these variables in commands.
env-SWITCHBOARD_WORKING_COLOR = ${colors.working}
env-SWITCHBOARD_IDLE_COLOR = ${colors.idle}
env-SWITCHBOARD_PERMISSION_COLOR = ${colors.permission}
env-SWITCHBOARD_UNKNOWN_COLOR = ${colors.disabled}
exec = $HOME/.config/switchboard/bin/switchboard-polybar --ctl $HOME/.config/switchboard/bin/switchboard-ctl --max-sessions 10 --working-color "$SWITCHBOARD_WORKING_COLOR" --idle-color "$SWITCHBOARD_IDLE_COLOR" --permission-color "$SWITCHBOARD_PERMISSION_COLOR" --unknown-color "$SWITCHBOARD_UNKNOWN_COLOR"
tail = true

; Each chip owns its left-click focus action. These bindings cover the whole
; module: right-click opens a picker and the wheel cycles sessions.
click-right = $HOME/.config/switchboard/bin/switchboard-ctl pick | rofi -dmenu -p Switchboard | awk '{print $1}' | xargs -r $HOME/.config/switchboard/bin/switchboard-ctl focus
scroll-up = $HOME/.config/switchboard/bin/switchboard-ctl cycle prev
scroll-down = $HOME/.config/switchboard/bin/switchboard-ctl cycle next

[settings]
screenchange-reload = true
pseudo-transparency = true
