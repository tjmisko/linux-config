# Enable merged multi-provider mode (Claude + Arachne). Non-destructive override:
# the empty ExecStart= clears the base unit's command before setting the new one.
# No -port: the binary's default is 8780 since 9a05a99, and 8080 is held by
# llama-server on this host.
[Service]
ExecStart=
ExecStart=%h/go/bin/switchboard-dashboard -ctl %h/go/bin/switchboard-ctl -providers %h/.config/switchboard/providers.json
