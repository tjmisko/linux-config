# Lock-hold instrumentation for the store-lock measurement arms.
#
# Enables the Apply hold warning in internal/state: any Apply held longer than
# this logs one line naming the duration, the session count and (on a build
# carrying 28ced0d) the calling function. scripts/lock-hold-report reads those
# lines out of the journal.
#
# 5ms is the threshold both prior arms used. On a healthy daemon the answer is
# silence; the read costs one comparison per Apply when unset, and one
# time.Now() when set.
#
# Drop this file (and `systemctl --user daemon-reload`) when measurement is
# over — it is instrumentation, not a setting worth keeping on.
[Service]
Environment=SWITCHBOARD_DEBUG_LOCK=5ms
