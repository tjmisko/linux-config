# Enable merged multi-provider mode (Claude + Arachne). Non-destructive override:
# the empty ExecStart= clears the base unit's command before setting the new one.
[Service]
ExecStart=
ExecStart=%h/.config/switchboard/bin/switchboard-dashboard -ctl %h/.config/switchboard/bin/switchboard-ctl -providers %h/.config/switchboard/providers.json
